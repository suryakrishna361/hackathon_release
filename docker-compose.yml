version: "3.9"

services:
  store-service:
    build: ./services/store-service
    container_name: store-service
    ports:
      - "8000:8000"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8001
    depends_on:
      - payment-service
    restart: unless-stopped

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "8001:8001"
    environment:
      - PAYMENT_TIMEOUT_MS=500
    restart: unless-stopped
